<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pranav Dudhane</title>
    <meta name="description" content="Pranav Dudhane - Software Engineer & Maker">
    <link rel="icon" href="./favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Cloudflare Analytics -->
    <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "4c215f56c2384eb0bca29b22b7d4ceb5"}'></script>

    <style>
        :root {
            --bg: #ffffff;
            --fg: #111827;
            --fg-muted: #6b7280;
            --border: #e5e7eb;
            --accent: #000000;
            --hover-bg: #f9fafb;
            --dot-color: #e5e7eb;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0a0a0a;
                --fg: #ededed;
                --fg-muted: #888888;
                --border: #262626;
                --accent: #ffffff;
                --hover-bg: #171717;
                --dot-color: #262626;
            }
            
            .icon {
                filter: invert(1);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--fg);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                linear-gradient(to right, var(--dot-color) 1px, transparent 1px),
                linear-gradient(to bottom, var(--dot-color) 1px, transparent 1px);
            background-size: 40px 40px;
            background-attachment: fixed;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, transparent 0%, var(--bg) 100%);
            pointer-events: none;
        }

        main {
            flex: 1;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            padding: 6rem 1.5rem;
            position: relative;
            z-index: 1;
        }

        header {
            margin-bottom: 4rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 600;
            letter-spacing: -0.03em;
            line-height: 1.1;
            margin-bottom: 0.5rem;
            color: var(--fg);
        }

        .subtitle {
            font-size: 1.125rem;
            color: var(--fg-muted);
            font-weight: 400;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 1px;
            background-color: var(--border);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.25rem 1.5rem;
            background-color: var(--bg);
            text-decoration: none;
            color: var(--fg);
            transition: background-color 0.2s ease;
        }

        .link-item:hover {
            background-color: var(--hover-bg);
        }

        .link-content {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .link-label {
            font-weight: 500;
        }

        .link-sub {
            font-size: 0.875rem;
            color: var(--fg-muted);
        }

        .icon {
            width: 20px;
            height: 20px;
            opacity: 0.8;
            fill: currentColor;
        }
        
        .arrow {
            color: var(--fg-muted);
            transition: transform 0.2s ease;
        }

        .link-item:hover .arrow {
            transform: translateX(4px);
            color: var(--fg);
        }

        footer {
            margin-top: 4rem;
            text-align: center;
            font-size: 0.875rem;
            color: var(--fg-muted);
        }

        @media (max-width: 640px) {
            main {
                padding-top: 4rem;
            }
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>
    <main>
        <header>
            <h1>Pranav Dudhane</h1>
            <p class="subtitle">Full Stack Engineer & Maker</p>
        </header>

        <div class="links">
            <a href="mailto:pranavsd152@gmail.com" class="link-item">
                <div class="link-content">
                    <img src="./assets/envelope.svg" class="icon" alt="Email">
                    <div>
                        <div class="link-label">Email</div>
                        <div class="link-sub">pranavsd152@gmail.com</div>
                    </div>
                </div>
                <svg class="arrow" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M6 12L10 8L6 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>

            <a href="https://www.linkedin.com/in/pro-nav/" target="_blank" class="link-item">
                <div class="link-content">
                    <img src="./assets/linkedin.svg" class="icon" alt="LinkedIn">
                    <div>
                        <div class="link-label">LinkedIn</div>
                        <div class="link-sub">/in/pro-nav</div>
                    </div>
                </div>
                <svg class="arrow" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M6 12L10 8L6 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>

            <a href="https://github.com/pro-nav/" target="_blank" class="link-item">
                <div class="link-content">
                    <img src="./assets/github.svg" class="icon" alt="GitHub">
                    <div>
                        <div class="link-label">GitHub</div>
                        <div class="link-sub">@pro-nav</div>
                    </div>
                </div>
                <svg class="arrow" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M6 12L10 8L6 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>
        </div>
        
        <footer>
            <p>&copy; 2025 Pranav Dudhane. All rights reserved.</p>
        </footer>
    </main>
</body>

</html>
