<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120">
  <defs>
    <radialGradient id="ffflux-gradient" cx="30%" cy="50%" r="80%">
      <stop offset="0%">
        <animate attributeName="stop-color"
          values="hsl(37,91%,55%);hsl(20,95%,50%);hsl(55,90%,55%);hsl(37,91%,55%)"
          dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%">
        <animate attributeName="stop-color"
          values="hsl(212,72%,59%);hsl(230,80%,55%);hsl(195,85%,50%);hsl(212,72%,59%)"
          dur="10s" repeatCount="indefinite"/>
      </stop>
    </radialGradient>

    <filter id="ffflux-filter" x="-20%" y="-20%" width="140%" height="140%"
            filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse"
            color-interpolation-filters="sRGB">

      <!-- Flowing turbulence (the flux) -->
      <feTurbulence type="fractalNoise" baseFrequency="0.004" numOctaves="2" seed="140"
                    stitchTiles="stitch" result="turbulence">
        <animate attributeName="baseFrequency"
          values="0.004;0.007;0.003;0.005;0.004"
          keyTimes="0;1"
          calcMode="spline"
          keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"
          dur="18s" repeatCount="indefinite"/>
      </feTurbulence>
      <feGaussianBlur stdDeviation="18 8" in="turbulence"
                      edgeMode="duplicate" result="blur"/>
      <feBlend mode="color-dodge" in="SourceGraphic" in2="blur" result="blended"/>

      <!-- Grain overlay -->
      <!-- <feTurbulence type="fractalNoise" baseFrequency="0.80" numOctaves="3"
                    stitchTiles="stitch" result="grain"/>
      <feColorMatrix type="saturate" values="0" in="grain" result="grayGrain"/>
      <feBlend in="blended" in2="grayGrain" mode="overlay" result="grainy"/>
      <feComposite in="grainy" in2="SourceGraphic" operator="in"/> -->

    </filter>
  </defs>

  <rect width="800" height="120" rx="10"
        fill="url(#ffflux-gradient)" filter="url(#ffflux-filter)"/>
</svg>
